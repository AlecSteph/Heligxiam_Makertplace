<div class="min-h-screen bg-gray-50">
  <div class="max-w-7xl mx-auto px-4 py-8">
    <!-- Breadcrumb -->
    <div class="flex items-center gap-2 text-sm text-gray-600 mb-6">
      <a routerLink="/" class="hover:text-blue-600">Accueil</a>
      <span>/</span>
      <span class="text-gray-900">{{ categoryName }}</span>
    </div>

    <!-- Header -->
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-gray-900 mb-2">{{ categoryName }}</h1>
      <p class="text-gray-600">{{ categoryProducts.length }} produits disponibles</p>
    </div>

    <!-- Products Grid -->
    <div *ngIf="categoryProducts.length > 0" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
      <app-product-card *ngFor="let product of categoryProducts" [product]="product"></app-product-card>
    </div>
    
    <div *ngIf="categoryProducts.length === 0" class="text-center py-16">
      <p class="text-gray-600 text-lg mb-4">Aucun produit dans cette catégorie</p>
      <a routerLink="/" class="text-blue-600 hover:underline">
        Retour à l'accueil
      </a>
    </div>
  </div>
</div>
