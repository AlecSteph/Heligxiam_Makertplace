<div class="min-h-screen bg-slate-50 flex items-center justify-center py-12 px-4">
  <div class="max-w-md w-full">
    <div class="text-center mb-8">
      <a routerLink="/" class="inline-flex items-center gap-2 text-slate-800 font-bold mb-6">
        <span class="w-8 h-8 rounded-lg bg-indigo-600 text-white flex items-center justify-center text-xs font-black">HX</span>
        HELIGXIAM
      </a>
      <h1 class="text-2xl font-bold text-slate-900">Nouveau mot de passe</h1>
      <p class="text-slate-500 mt-2 text-sm">Choisissez un mot de passe sécurisé pour votre compte.</p>
    </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-6 sm:p-8">
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Nouveau mot de passe</label>
          <div class="relative">
            <input id="password" [type]="showPassword ? 'text' : 'password'" formControlName="password"
                   class="w-full px-3 py-2.5 pr-10 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-900"
                   placeholder="8 caractères min." autocomplete="new-password" />
            <button type="button" (click)="showPassword = !showPassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 text-xs font-medium">
              {{ showPassword ? 'Masquer' : 'Afficher' }}
            </button>
          </div>
          <p *ngIf="getError('password')" class="mt-1 text-xs text-red-600">{{ getError('password') }}</p>
        </div>

        <div>
          <label for="confirm" class="block text-sm font-semibold text-slate-700 mb-1.5">Confirmer</label>
          <input id="confirm" [type]="showConfirm ? 'text' : 'password'" formControlName="confirmPassword"
                 class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 text-slate-900"
                 placeholder="Retapez le mot de passe" />
          <p *ngIf="form.errors?.['mismatch'] && form.get('confirmPassword')?.touched" class="mt-1 text-xs text-red-600">
            Les mots de passe ne correspondent pas.
          </p>
        </div>

        <div *ngIf="successMessage" class="p-3 bg-emerald-50 border border-emerald-100 rounded-xl text-emerald-700 text-sm">{{ successMessage }}</div>
        <div *ngIf="errorMessage" class="p-3 bg-red-50 border border-red-100 rounded-xl text-red-700 text-sm">{{ errorMessage }}</div>

        <button type="submit" [disabled]="isLoading || !token"
                class="w-full py-3 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-semibold text-sm hover:opacity-95 disabled:opacity-60 transition">
          {{ isLoading ? 'Mise à jour…' : 'Enregistrer le mot de passe' }}
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/account" class="text-indigo-600 hover:text-indigo-700 font-medium text-sm">← Retour à la connexion</a>
      </div>
    </div>
  </div>
</div>
