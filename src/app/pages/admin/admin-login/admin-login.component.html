<div class="min-h-screen bg-slate-950 text-slate-100 flex flex-col items-center justify-center relative overflow-hidden px-4">
  <!-- Fond subtil -->
  <div
    class="absolute inset-0 bg-[radial-gradient(ellipse_120%_80%_at_50%_-20%,rgb(99,102,241,0.25),transparent_55%),radial-gradient(ellipse_80%_50%_at_100%_50%,rgb(168,85,247,0.12),transparent)]">
  </div>

  <!-- Rideaux (durée = CURTAIN_MS dans le .ts, pas de transitionend — évite les bugs multi-navigateurs) -->
  <div class="absolute inset-0 z-20 flex pointer-events-none curtain-wrap">
    <div
      class="curtain curtain-l absolute left-0 top-0 h-full w-1/2 bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 border-r border-indigo-500/20 will-change-transform"
      [ngClass]="curtainsOpen ? '-translate-x-full' : 'translate-x-0'">
    </div>
    <div
      class="curtain curtain-r absolute right-0 top-0 h-full w-1/2 bg-gradient-to-bl from-slate-900 via-violet-950 to-slate-900 border-l border-violet-500/20 will-change-transform"
      [ngClass]="curtainsOpen ? 'translate-x-full' : 'translate-x-0'">
    </div>
  </div>

  <!-- Nom du site — visible pendant la fermeture, puis disparaît -->
  <div
    *ngIf="brandVisible"
    class="absolute z-30 inset-0 flex flex-col items-center justify-center pointer-events-none">
    <p
      class="text-[0.65rem] uppercase tracking-[0.35em] text-indigo-300/90 mb-3 brand-sub">
      Espace réservé
    </p>
    <h1
      class="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-white brand-glow select-none text-center">
      <span class="bg-gradient-to-r from-white via-indigo-100 to-violet-200 bg-clip-text text-transparent">
        HELIGXIAM
      </span>
    </h1>
    <p class="mt-4 text-sm sm:text-base text-slate-400 font-medium tracking-wide">Administration de la place de marché</p>
  </div>

  <!-- Formulaire -->
  <div
    *ngIf="formVisible"
    class="relative z-40 w-full max-w-md form-enter">
    <div class="rounded-2xl border border-white/10 bg-slate-900/80 backdrop-blur-xl p-8 shadow-2xl shadow-indigo-900/30">
      <div class="flex items-center justify-center gap-2 mb-6">
        <lucide-angular [img]="Shield" class="w-8 h-8 text-indigo-400"></lucide-angular>
        <div>
          <h2 class="text-xl font-bold text-white">Connexion administrateur</h2>
          <p class="text-xs text-slate-400">Accès sécurisé au tableau de bord</p>
        </div>
      </div>

      <form (ngSubmit)="submit()" class="space-y-4">
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1.5">E-mail</label>
          <div class="relative">
            <lucide-angular [img]="Mail" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></lucide-angular>
            <input
              type="email"
              name="email"
              [(ngModel)]="email"
              class="w-full pl-10 pr-3 py-2.5 rounded-xl bg-slate-800/80 border border-slate-600 text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
              autocomplete="username"
            />
          </div>
        </div>
        <div>
          <label class="text-xs font-semibold text-slate-400 block mb-1.5">Mot de passe</label>
          <div class="relative">
            <lucide-angular [img]="KeyRound" class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2"></lucide-angular>
            <input
              type="password"
              name="password"
              [(ngModel)]="password"
              class="w-full pl-10 pr-3 py-2.5 rounded-xl bg-slate-800/80 border border-slate-600 text-slate-100 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
              autocomplete="current-password"
              placeholder="••••••••••••"
            />
          </div>
        </div>

        <div
          *ngIf="errorMessage"
          class="flex items-center gap-2 text-rose-400 text-sm bg-rose-950/50 border border-rose-800/50 rounded-lg px-3 py-2">
          <lucide-angular [img]="AlertCircle" class="w-4 h-4 flex-shrink-0"></lucide-angular>
          {{ errorMessage }}
        </div>

        <button
          type="submit"
          class="w-full flex items-center justify-center gap-2 py-3 rounded-xl font-bold text-white bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 transition-all shadow-lg shadow-indigo-900/40"
        >
          Entrer
          <lucide-angular [img]="ArrowRight" class="w-4 h-4"></lucide-angular>
        </button>
      </form>
    </div>
    <p class="text-center mt-6 text-xs text-slate-500">
      <a routerLink="/" class="text-indigo-400 hover:text-indigo-300">← Retour à la boutique</a>
    </p>
  </div>

  <!-- Bloque toute interaction (clic, souris) jusqu’à fin du rideau + apparition du formulaire -->
  <div
    *ngIf="!interactionUnlocked"
    class="fixed inset-0 z-[200] cursor-wait bg-slate-950/0"
    aria-hidden="true">
  </div>
</div>
