<!-- =========== FLOATING BUBBLE (closed state) =========== -->
<button *ngIf="!isOpen || isMinimized"
        type="button"
        class="chatbot-bubble chatbot-drag-handle"
        (mousedown)="startDrag($event)"
        (touchstart)="startDrag($event)"
        (click)="onBubbleClick($event)"
        [style.right.px]="posX"
        [style.bottom.px]="posY"
        [class]="'fixed z-[60] flex items-center gap-2 select-none cursor-grab active:cursor-grabbing shadow-2xl rounded-full transition-all hover:scale-105 ' +
          (isMinimized ? 'pl-2 pr-4 py-2 bg-white border border-slate-200' : 'p-0')">
  <!-- Bubble -->
  <div *ngIf="!isMinimized"
       [class]="'relative w-14 h-14 rounded-full bg-gradient-to-br ' + bubbleGradient + ' flex items-center justify-center shadow-xl'">
    <lucide-angular [img]="MessageCircle" class="w-6 h-6 text-white"></lucide-angular>
    <!-- Pulse ring -->
    <span [class]="'absolute inset-0 rounded-full animate-ping-slow opacity-30 ' + pulseColor"></span>
    <!-- Mode indicator dot -->
    <span [class]="'absolute top-0 right-0 w-3.5 h-3.5 rounded-full ring-2 ring-white ' + pulseColor"></span>
    <!-- Drag hint -->
    <span class="absolute -top-1.5 -left-1.5 w-5 h-5 bg-white rounded-full flex items-center justify-center shadow-md opacity-0 hover:opacity-100 transition">
      <lucide-angular [img]="Move" class="w-3 h-3 text-slate-500"></lucide-angular>
    </span>
  </div>

  <!-- Minimized strip -->
  <ng-container *ngIf="isMinimized">
    <div [class]="'w-8 h-8 rounded-full bg-gradient-to-br ' + bubbleGradient + ' flex items-center justify-center flex-shrink-0'">
      <lucide-angular [img]="Bot" class="w-4 h-4 text-white"></lucide-angular>
    </div>
    <div class="text-left">
      <p class="text-[11px] font-bold text-slate-900 leading-tight">{{ mode === 'seller' ? 'Seller Assist' : 'Assistant' }}</p>
      <p class="text-[10px] text-emerald-600 leading-tight flex items-center gap-1">
        <span [class]="'w-1.5 h-1.5 rounded-full ' + pulseColor"></span>
        En ligne
      </p>
    </div>
  </ng-container>
</button>

<!-- =========== OPEN WINDOW =========== -->
<div *ngIf="isOpen && !isMinimized"
     #chatWindow
     [style.right.px]="posX"
     [style.bottom.px]="posY"
     class="chatbot-window fixed z-[60] w-[min(92vw,380px)] h-[min(560px,85dvh)] bg-white rounded-2xl shadow-2xl border border-slate-200 flex flex-col overflow-hidden animate-pop">

  <!-- Header (drag handle) -->
  <div
    class="chatbot-drag-handle"
    (mousedown)="startDrag($event)"
    (touchstart)="startDrag($event)"
    [class]="'relative cursor-grab active:cursor-grabbing bg-gradient-to-br ' + headerGradient + ' text-white p-3 flex items-center gap-3 select-none'">
    <div class="relative w-10 h-10 rounded-full bg-white/20 backdrop-blur flex items-center justify-center flex-shrink-0">
      <lucide-angular [img]="Bot" class="w-5 h-5 text-white"></lucide-angular>
      <span [class]="'absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full ring-2 ring-white ' + pulseColor"></span>
    </div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-1.5">
        <p class="font-bold text-sm truncate">{{ title }}</p>
        <span class="text-[9px] font-bold bg-white/25 backdrop-blur px-1.5 py-0.5 rounded-full uppercase tracking-wide">
          {{ mode === 'seller' ? 'Vendeur' : 'Client' }}
        </span>
      </div>
      <p class="text-[11px] text-white/80 truncate flex items-center gap-1">
        <lucide-angular [img]="Move" class="w-3 h-3 opacity-60"></lucide-angular>
        {{ subtitle }}
      </p>
    </div>
    <!-- Controls -->
    <button type="button"
            (click)="resetConversation()"
            title="Nouvelle conversation"
            class="p-1.5 hover:bg-white/20 rounded-md transition">
      <lucide-angular [img]="Sparkles" class="w-4 h-4"></lucide-angular>
    </button>
    <button type="button"
            (click)="minimize()"
            title="Réduire"
            class="p-1.5 hover:bg-white/20 rounded-md transition">
      <lucide-angular [img]="Minimize2" class="w-4 h-4"></lucide-angular>
    </button>
    <button type="button"
            (click)="close()"
            title="Fermer"
            class="p-1.5 hover:bg-white/20 rounded-md transition">
      <lucide-angular [img]="X" class="w-4 h-4"></lucide-angular>
    </button>
  </div>

  <!-- Quick actions strip (shown only if conversation is short) -->
  <div *ngIf="messages.length <= 2"
       class="p-3 border-b border-slate-100 bg-slate-50">
    <p class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-2">
      {{ mode === 'seller' ? 'Raccourcis vendeur' : 'Que puis-je faire pour vous ?' }}
    </p>
    <div class="grid grid-cols-3 gap-1.5">
      <button *ngFor="let a of quickActions"
              type="button"
              (click)="handleQuickAction(a)"
              class="group flex flex-col items-center gap-1 p-2 rounded-lg border border-slate-200 bg-white hover:border-indigo-300 hover:bg-indigo-50/40 transition-all">
        <div [class]="'w-7 h-7 rounded-md bg-gradient-to-br ' + a.color + ' flex items-center justify-center shadow-sm'">
          <lucide-angular [img]="a.icon" class="w-3.5 h-3.5 text-white"></lucide-angular>
        </div>
        <span class="text-[10px] font-semibold text-slate-700 text-center leading-tight">{{ a.label }}</span>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-3 space-y-3 chat-scroll bg-slate-50/60">
    <ng-container *ngFor="let msg of messages">
      <!-- Bot msg -->
      <div *ngIf="msg.from === 'bot'" class="flex items-start gap-2">
        <div [class]="'w-7 h-7 rounded-full bg-gradient-to-br ' + bubbleGradient + ' flex items-center justify-center flex-shrink-0 shadow-sm'">
          <lucide-angular [img]="Bot" class="w-3.5 h-3.5 text-white"></lucide-angular>
        </div>
        <div class="flex-1 min-w-0 max-w-[85%]">
          <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-md p-3 shadow-sm">
            <div class="text-xs text-slate-800 leading-relaxed" [innerHTML]="formatText(msg.text)"></div>
          </div>
          <!-- Suggestions (actions) -->
          <div *ngIf="msg.suggestions?.length" class="mt-2 space-y-1.5">
            <button *ngFor="let s of msg.suggestions"
                    type="button"
                    (click)="handleSuggestion(s.action)"
                    class="w-full flex items-center gap-2 px-3 py-2 bg-white border border-indigo-200 hover:border-indigo-400 hover:bg-indigo-50 rounded-lg text-xs font-semibold text-indigo-700 transition group">
              <lucide-angular *ngIf="s.icon" [img]="s.icon" class="w-3.5 h-3.5 flex-shrink-0"></lucide-angular>
              <span class="flex-1 text-left">{{ s.label }}</span>
              <span class="opacity-0 group-hover:opacity-100 transition">→</span>
            </button>
          </div>
          <!-- Quick replies -->
          <div *ngIf="msg.quickReplies?.length" class="mt-2 flex flex-wrap gap-1.5">
            <button *ngFor="let q of msg.quickReplies"
                    type="button"
                    (click)="handleQuickReply(q)"
                    [class]="'px-2.5 py-1 text-[11px] font-semibold rounded-full border transition ' +
                      (mode === 'seller'
                        ? 'bg-amber-50 border-amber-200 text-amber-700 hover:bg-amber-100'
                        : 'bg-indigo-50 border-indigo-200 text-indigo-700 hover:bg-indigo-100')">
              {{ q }}
            </button>
          </div>
          <!-- Feedback row -->
          <div class="flex items-center gap-2 mt-1.5 pl-1">
            <span class="text-[10px] text-slate-400">{{ formatTime(msg.time) }}</span>
            <div class="flex items-center gap-0.5">
              <button type="button" (click)="giveFeedback(msg, 'up')"
                      [class]="'p-1 rounded hover:bg-slate-200 transition ' + (msg.feedback === 'up' ? 'text-green-600' : 'text-slate-400')">
                <lucide-angular [img]="ThumbsUp" class="w-3 h-3"></lucide-angular>
              </button>
              <button type="button" (click)="giveFeedback(msg, 'down')"
                      [class]="'p-1 rounded hover:bg-slate-200 transition ' + (msg.feedback === 'down' ? 'text-red-600' : 'text-slate-400')">
                <lucide-angular [img]="ThumbsDown" class="w-3 h-3"></lucide-angular>
              </button>
            </div>
          </div>
        </div>
      </div>

      <!-- User msg -->
      <div *ngIf="msg.from === 'user'" class="flex items-start gap-2 justify-end">
        <div class="flex-1 min-w-0 max-w-[85%]">
          <div [class]="'rounded-2xl rounded-tr-md p-3 shadow-sm text-white bg-gradient-to-br ' + bubbleGradient">
            <div class="text-xs leading-relaxed" [innerHTML]="formatText(msg.text)"></div>
          </div>
          <p class="text-[10px] text-slate-400 mt-1 text-right pr-1">{{ formatTime(msg.time) }}</p>
        </div>
        <div class="w-7 h-7 rounded-full bg-slate-200 flex items-center justify-center flex-shrink-0">
          <lucide-angular [img]="UserIcon" class="w-3.5 h-3.5 text-slate-600"></lucide-angular>
        </div>
      </div>
    </ng-container>

    <!-- Typing indicator -->
    <div *ngIf="isTyping" class="flex items-start gap-2">
      <div [class]="'w-7 h-7 rounded-full bg-gradient-to-br ' + bubbleGradient + ' flex items-center justify-center flex-shrink-0 shadow-sm'">
        <lucide-angular [img]="Bot" class="w-3.5 h-3.5 text-white"></lucide-angular>
      </div>
      <div class="bg-white border border-slate-200 rounded-2xl rounded-tl-md px-3 py-2.5 shadow-sm">
        <div class="flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce" style="animation-delay: 0.15s"></span>
          <span class="w-1.5 h-1.5 rounded-full bg-slate-400 animate-bounce" style="animation-delay: 0.3s"></span>
        </div>
      </div>
    </div>

    <div #messagesEnd></div>
  </div>

  <!-- Input -->
  <div class="p-2.5 border-t border-slate-200 bg-white">
    <div class="flex items-end gap-2">
      <div class="flex-1 relative">
        <textarea
          [(ngModel)]="inputText"
          (keydown)="onInputKeyDown($event)"
          [placeholder]="mode === 'seller' ? 'Posez une question sur vos ventes, stock, pub…' : 'Tapez votre message…'"
          rows="1"
          class="w-full resize-none max-h-24 px-3 py-2 pr-10 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 focus:bg-white transition"></textarea>
      </div>
      <button type="button"
              (click)="send()"
              [disabled]="!inputText.trim() || isTyping"
              [class]="'w-9 h-9 rounded-full flex items-center justify-center text-white transition-all flex-shrink-0 ' +
                (inputText.trim()
                  ? 'bg-gradient-to-br ' + bubbleGradient + ' hover:scale-105 shadow-md'
                  : 'bg-slate-300 cursor-not-allowed')">
        <lucide-angular [img]="Send" class="w-4 h-4"></lucide-angular>
      </button>
    </div>
    <p class="text-[9px] text-slate-400 mt-1.5 flex items-center gap-1 px-1">
      <lucide-angular [img]="ShieldCheck" class="w-2.5 h-2.5"></lucide-angular>
      Vos échanges sont chiffrés · Assistant IA, contactez un humain si besoin
    </p>
  </div>
</div>
