<a
  [routerLink]="['/product', product.id]"
  class="group bg-white rounded-2xl border border-gray-100 hover:border-indigo-200 hover:shadow-2xl transition-all duration-300 overflow-hidden block"
  (mouseenter)="isHovered = true"
  (mouseleave)="isHovered = false"
>
  <!-- Image Container -->
  <div class="relative aspect-[4/5] overflow-hidden bg-gradient-to-br from-gray-50 to-gray-100">
    <img
      [src]="product.image"
      [alt]="product.name"
      class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
    />
    
    <!-- Overlay Badges -->
    <div class="absolute top-3 left-3 right-3 flex justify-between items-start">
      <div
        *ngIf="product.badge"
        [class]="getBadgeClass(product.badge) + ' px-3 py-1.5 rounded-full text-xs font-bold backdrop-blur-md shadow-lg'"
      >
        {{ product.badge }}
      </div>
      <button
        (click)="handleLike($event)"
        [class]="'ml-auto p-2 rounded-full backdrop-blur-md shadow-lg transition-all ' + 
          (isLiked ? 'bg-red-500 text-white scale-110' : 'bg-white/90 text-gray-700 hover:bg-red-50')"
      >
        <lucide-angular 
          [img]="Heart" 
          [class]="'w-4 h-4 ' + (isLiked ? 'fill-current' : '')"
        ></lucide-angular>
      </button>
    </div>

    <!-- Discount Badge -->
    <div
      *ngIf="discount > 0"
      class="absolute bottom-3 left-3 bg-gradient-to-r from-red-600 to-pink-600 text-white px-3 py-1 rounded-full text-xs font-bold shadow-lg"
    >
      -{{ discount }}%
    </div>

    <!-- Quick Actions -->
    <div
      [class]="'absolute bottom-3 right-3 flex gap-2 transition-all duration-300 ' + 
        (isHovered ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-2')"
    >
      <button class="p-2 bg-white rounded-full shadow-lg hover:scale-110 transition-transform">
        <lucide-angular [img]="Eye" class="w-4 h-4 text-gray-700"></lucide-angular>
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="p-5">
    <!-- Brand -->
    <div *ngIf="product.brand" class="text-xs font-semibold text-indigo-600 mb-1 uppercase tracking-wide">
      {{ product.brand }}
    </div>
    <div *ngIf="product.sellerName" class="text-xs text-gray-500 mb-2 truncate">
      {{ product.sellerName }}
    </div>

    <!-- Title -->
    <h3 class="font-semibold text-gray-900 line-clamp-2 mb-3 group-hover:text-indigo-600 transition-colors leading-snug">
      {{ product.name }}
    </h3>

    <!-- Rating -->
    <div class="flex items-center gap-2 mb-3">
      <div class="flex items-center gap-1">
        <lucide-angular [img]="Star" class="w-4 h-4 fill-amber-400 text-amber-400"></lucide-angular>
        <span class="text-sm font-semibold text-gray-900">{{ product.rating }}</span>
      </div>
      <span class="text-sm text-gray-500">({{ product.reviews.toLocaleString() }})</span>
      <lucide-angular 
        *ngIf="product.reviews > 1000"
        [img]="TrendingUp" 
        class="w-3.5 h-3.5 text-green-500"
      ></lucide-angular>
    </div>

    <!-- Price -->
    <div class="flex items-baseline gap-2 mb-4">
      <span class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
        {{ product.price | localizedPrice }}
      </span>
      <span *ngIf="product.originalPrice" class="text-sm text-gray-400 line-through">
        {{ product.originalPrice | localizedPrice }}
      </span>
    </div>

    <!-- Add to Cart Button -->
    <button
      *ngIf="product.inStock; else outOfStock"
      (click)="handleAddToCart($event)"
      class="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-indigo-600 to-purple-600 text-white py-3 rounded-xl hover:shadow-xl hover:scale-105 transition-all font-medium"
    >
      <lucide-angular [img]="ShoppingCart" class="w-4 h-4"></lucide-angular>
      {{ 'action.addToCart' | t }}
    </button>
    <ng-template #outOfStock>
      <button
        disabled
        class="w-full bg-gray-200 text-gray-500 py-3 rounded-xl cursor-not-allowed font-medium"
      >
        {{ 'price.outOfStock' | t }}
      </button>
    </ng-template>
  </div>
</a>
