# Stack Heligxiam — branche Alec
# Frontend Angular : npm start → http://localhost:4200 (hôte)
# Microservices exposés sur 3001–3004

name: heligxiam

x-mysql-env: &mysql-env
  MYSQL_HOST: mysql
  MYSQL_PORT: 3306
  MYSQL_USER: root
  MYSQL_PASSWORD: password
  MYSQL_DATABASE: heligxiam_marketplace

x-postgres-env: &postgres-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_NAME: marketplace
  DB_USER: postgres
  DB_PASSWORD: password

x-jwt-env: &jwt-env
  JWT_SECRET: heligxiam_jwt_secret_dev_change_in_prod
  JWT_REFRESH_SECRET: heligxiam_jwt_refresh_secret_dev_change_in_prod

services:
  postgres:
    image: postgres:16-alpine
    container_name: heligxiam_postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - marketplace_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - heligxiam-net

  mongodb:
    image: mongo:7
    container_name: heligxiam_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: marketplace_nosql
    ports:
      - "27018:27017"
    volumes:
      - marketplace_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - heligxiam-net

  mysql:
    image: mysql:8.0
    container_name: heligxiam_mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: heligxiam_marketplace
    ports:
      - "3307:3306"
    volumes:
      - marketplace_mysql_data:/var/lib/mysql
      - ./docker/mysql/01_use.sql:/docker-entrypoint-initdb.d/01_use.sql:ro
      - ./docs/sql/heligxiam_marketplace_core_mysql.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - heligxiam-net

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: heligxiam_auth
    ports:
      - "3001:3001"
    environment:
      <<: [*postgres-env, *jwt-env, *mysql-env]
      PORT: 3001
      NODE_ENV: development
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: admin
      MONGO_PASSWORD: admin
      MONGO_AUTH_SOURCE: admin
      MONGO_DB_NAME: marketplace_nosql
      ADMIN_EMAIL: admin@heligxiam.com
      ADMIN_PASSWORD: Heligxiam2026!
      BCRYPT_ROUNDS: 12
      ORDER_SERVICE_URL: http://order-service:3004
      FRONTEND_URL: http://localhost:4200
      # Google reCAPTCHA v2 — clés de test (toujours valides en dev)
      RECAPTCHA_SITE_KEY: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
      RECAPTCHA_SECRET_KEY: 6LeIxAcTAAAAAGG-vFI1TnRWxM07dQ98LWgjn
      # SMTP_PORT: 587
      # SMTP_USER: user
      # SMTP_PASS: pass
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      mysql:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - heligxiam-net

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: heligxiam_product
    ports:
      - "3002:3002"
    environment:
      <<: [*postgres-env, *jwt-env]
      PORT: 3002
      NODE_ENV: development
      ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - heligxiam-net

  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    container_name: heligxiam_cart
    ports:
      - "3003:3003"
    environment:
      <<: [*postgres-env, *jwt-env]
      PORT: 3003
      NODE_ENV: development
      ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
      PRODUCT_SERVICE_URL: http://product-service:3002
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      product-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - heligxiam-net

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: heligxiam_order
    ports:
      - "3004:3004"
    environment:
      <<: [*postgres-env, *jwt-env]
      PORT: 3004
      NODE_ENV: development
      ALLOWED_ORIGINS: http://localhost:4200,http://127.0.0.1:4200
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - heligxiam-net

networks:
  heligxiam-net:
    driver: bridge

volumes:
  marketplace_pg_data:
  marketplace_mongo_data:
  marketplace_mysql_data:
